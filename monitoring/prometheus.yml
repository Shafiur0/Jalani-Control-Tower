global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - 'alerts.yml'

scrape_configs:
  - job_name: 'backend-api'
    static_configs:
      - targets: ['backend-api:8080']
    metrics_path: '/metrics'

  - job_name: 'intelligence-service'
    static_configs:
      - targets: ['intelligence-service:8081']
    metrics_path: '/metrics'
    scrape_interval: 10s
