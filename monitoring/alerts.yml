groups:
  - name: jalani_alerts
    rules:
      - alert: HighRiskStation
        expr: jalani_risk_score > 0.7
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Station {{ $labels.station }} {{ $labels.fuel_type }} at critical risk"

      - alert: ServiceLevelDrop
        expr: jalani_service_level_pct < 85
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Service level dropped to {{ $value }}%"

      - alert: CircuitBreakerOpen
        expr: jalani_operating_mode > 0
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: "System in degraded mode"
